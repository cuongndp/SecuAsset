<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - Guardly</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="shell">
  <section class="brand" aria-label="Giới thiệu hệ thống">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
      <span>Guardly</span>
    </div>
    <h2>Quản lý tài sản và thiết bị an ninh trong một nơi</h2>
    <ul class="features">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Mã QR riêng cho từng tài sản</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Theo dõi lịch bảo trì và sửa chữa</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Lưu đầy đủ lịch sử đổi trạng thái</li>
    </ul>
  </section>

  <section class="form-wrap">
    <div>
      <h1>Đăng nhập</h1>
      <p class="sub">Dùng tài khoản do quản trị viên cấp.</p>
    </div>

    <div id="alert" class="alert" role="alert" aria-live="polite" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
      <span id="alertText"></span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <div class="input" id="userBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input id="username" name="username" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username" aria-describedby="userError" autofocus>
        </div>
        <div class="field-error" id="userError"></div>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="input" id="passBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" aria-describedby="passError">
          <button type="button" class="toggle" id="toggle" aria-label="Hiện mật khẩu" aria-pressed="false">
            <svg class="on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
          </button>
        </div>
        <div class="field-error" id="passError"></div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span id="btnText">Đăng nhập</span>
      </button>
    </form>

    <div class="foot">Hệ thống quản lý tài sản và thiết bị an ninh</div>
  </section>
</main>

<script src="js/login.js"></script>
</body>
</html>
