services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: secuam-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - secuam-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: secuam-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - secuam-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secuam-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=db,1433;Database=SecuAM;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Redis__Connection: "redis:6379"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: SecuAM
      Jwt__Audience: SecuAM.Web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - secuam-net

  web:
    image: nginx:alpine
    container_name: secuam-web
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - secuam-net

volumes:
  sqlserver_data:
  redis_data:
  uploads_data:

networks:
  secuam-net:
    driver: bridge